spring:
  application:
    name: todo-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
